<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <title>index</title>
</head>

<body>
  <%- include('./layout/header'); -%>
    <main class="bg-light">
      <div class="container py-5">
        <div class="row">
          <div class=" col-lg-3">
            <div class="list-group">
              <div class="list-group-item py-5 text-center">
                <img src="../assets/images/avatar.png" alt="avatar" class="mb-3">
                <h3 class="h4 mb-2 ">Josh</h3>
                <p class="text-secondary mb-2 text-sm">helloworld@gmail.com</p>
                <button type="button" class="btn btn-success text-sm fw-normal lh-base rounded-4">已驗證</button>
              </div>
              <a href="#" class="list-group-item list-group-item-action p-3 active" aria-current="true" id="profile-tab"
                data-bs-toggle="tab" data-bs-target="#profile-tab-pane"><i class="bi bi-person me-2"></i>個人資料</a>
              <a href="#" class="list-group-item list-group-item-action p-3" id="upload-tab" data-bs-toggle="tab"
                data-bs-target="#upload-tab-pane"><i class="bi bi-laptop me-2"></i>我上架的 AI 工具</a>
              <a href="#" class="list-group-item list-group-item-action p-3" id="subscribe-tab" data-bs-toggle="tab"
                data-bs-target="#subscribe-tab-pane"><i class="bi bi-list-ul me-2"></i>我訂閱的 AI 工具</a>
            </div>
          </div>
          <div class=" col-lg-9">
            <div class="tab-content" id="myTabContent">
              <div class="tab-pane fade show active" id="profile-tab-pane" role="tabpanel" aria-labelledby="profile-tab"
                tabindex="0">
                <form>
                  <div class="bg-white p-5 rounded-3 mb-3">
                    <h3 class="h4 mb-4">基本資料</h3>
                    <div class="row gy-4">
                      <div class="col-lg-6 ">
                        <label for="exampleFormControlInput1" class="form-label mb-1">姓名<span
                            class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="exampleFormControlInput1" value="Josh" readonly>
                      </div>
                      <div class="col-lg-6 ">
                        <label for="exampleFormControlInput1" class="form-label mb-1">暱稱</label>
                        <input type="text" class="form-control" id="exampleFormControlInput1" placeholder="請輸入你的暱稱">
                      </div>
                      <div class="col-lg-6 ">
                        <label for="exampleFormControlInput1" class="form-label">生日<span
                            class="text-danger">*</span></label>
                        <input type="date" class="form-control" id="exampleFormControlInput1"
                          placeholder="name@example.com">
                      </div>
                      <div class="col-lg-6 ">
                        <label for="exampleFormControlInput1" class="form-label">聯絡信箱<span
                            class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="exampleFormControlInput1"
                          value="helloworld@gmail.com" readonly>
                      </div>
                      <div class="col-lg-6 ">
                        <label for="exampleFormControlInput1" class="form-label">聯絡電話<span
                            class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="exampleFormControlInput1" placeholder="0912345678">
                      </div>
                    </div>


                  </div>
                  <div class="bg-white p-5 rounded-3">
                    <h3 class="h4 mb-2">通知設定
                    </h3>
                    <p class="text-sm text-secondary mb-4">通知將寄送到 helloworld@gmail.com ，如需變更，請至頁面上方的基本資料修改聯絡信箱</p>
                    <div class="mb-4">

                      <div class="form-check mb-1">
                        <input class="form-check-input" type="checkbox" value="" id="check1">
                        <label class="form-check-label" for="check1">
                          工具評價與回饋
                        </label>
                      </div>
                      <p class="text-sm text-secondary">即時掌握使用者留下的評價和回饋</p>
                    </div>
                    <div class="mb-4">
                      <div class="form-check mb-1">
                        <input class="form-check-input" type="checkbox" value="" id="check2">
                        <label class="form-check-label" for="check2">
                          AI 趨勢與最新工具
                        </label>
                       
                      </div>
                       <p class="text-sm text-secondary">推薦適合你的新 AI 工具</p>
                    </div>
                    <div class="mb-4">
                      <div class="form-check mb-1">
                        <input class="form-check-input" type="checkbox" value="" id="check3">
                        <label class="form-check-label" for="check3">
                          工具功能更新
                        </label>
                        
                      </div>
                      <p class="text-sm text-secondary">當你訂閱的 AI 工具有新功能或重要更新時，我們會寄信通知你</p>
                    </div>
                    <div class="mb-4">
                      <div class="form-check mb-1">
                        <input class="form-check-input" type="checkbox" value="" id="check4">
                        <label class="form-check-label" for="check4">
                          活動與優惠資訊
                        </label>
                      </div>
                      <p class="text-sm text-secondary">推薦適合你的新 AI 工具</p>
                    </div>
                  </div>
                </form>
              </div>
              <div class="tab-pane fade" id="upload-tab-pane" role="tabpanel" aria-labelledby="upload-tab" tabindex="0">
                ...2</div>
              <div class="tab-pane fade" id="subscribe-tab-pane" role="tabpanel" aria-labelledby="subscribe-tab"
                tabindex="0">...3</div>

            </div>
          </div>
        </div>
      </div>
    </main>

    <%- include('./layout/footer'); -%>

      <script type="module" src="../main.js"></script>
</body>

</html>
